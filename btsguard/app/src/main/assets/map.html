<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
html,body,#map{height:100%;margin:0;background:#0b1220}
.leaflet-control-attribution{font-size:9px}
</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map',{zoomControl:true}).setView([-6.2,106.8166],12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
let current=null, estimate=null, dfTarget=null;
const samples=L.layerGroup().addTo(map), bearings=L.layerGroup().addTo(map);
function setCurrent(lat,lng){ if(current) map.removeLayer(current); current=L.circleMarker([lat,lng],{radius:7,color:'#1976d2',fillOpacity:.9}).addTo(map).bindPopup('Current position'); map.setView([lat,lng],15); }
function addCellSample(lat,lng,dbm,label){ const c=dbm>-70?'#d32f2f':dbm>-90?'#f57c00':'#388e3c'; L.circleMarker([lat,lng],{radius:6,color:c,fillOpacity:.75}).addTo(samples).bindPopup(label+'<br>'+dbm+' dBm'); }
function showEstimate(lat,lng,radius){ if(estimate) map.removeLayer(estimate); estimate=L.circle([lat,lng],{radius:radius,color:'#7b1fa2',fillOpacity:.14}).addTo(map).bindPopup('Estimated strongest-signal area'); }
function addBearing(lat,lng,lat2,lng2,bearing){ L.polyline([[lat,lng],[lat2,lng2]],{color:'#e91e63',weight:3,dashArray:'7,7'}).addTo(bearings).bindPopup('Bearing '+bearing+'°'); }
function showDfTarget(lat,lng){ if(dfTarget) map.removeLayer(dfTarget); dfTarget=L.marker([lat,lng]).addTo(map).bindPopup('Estimated DF intersection').openPopup(); map.panTo([lat,lng]); }
function clearMap(){ samples.clearLayers(); bearings.clearLayers(); if(estimate){map.removeLayer(estimate);estimate=null;} if(dfTarget){map.removeLayer(dfTarget);dfTarget=null;} }
</script>
</body>
</html>
