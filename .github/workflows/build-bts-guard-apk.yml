name: Build BTS Guard APK
on:
  push:
    branches: [chatgpt-bts-guard-apk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: btsguard
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp btsguard/app/build/outputs/apk/debug/app-debug.apk BTS_Guard_DF_v0.1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BTS_Guard_DF_APK
          path: BTS_Guard_DF_v0.1.0.apk
