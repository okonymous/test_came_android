name: Build Astra APK

on:
  push:
    branches: [ "astra-build" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install Android SDK 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: AstraZFold6
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp AstraZFold6/app/build/outputs/apk/debug/app-debug.apk Astra-ZFold6-v0.5.1-Realtime.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Astra-ZFold6-v0.5.1-Realtime
          path: Astra-ZFold6-v0.5.1-Realtime.apk
          if-no-files-found: error
